<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Marty Ornish, fiber artist: wearable art, art quilts and assemblage from deconstructed vintage textiles.">
</head>
<body style="margin:0;background:#000">
<title>MartyO Museum Walk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
<style>
:root {
  color-scheme: dark;
  --black: #000;
  --white: #f6f4f0;
  --label: #ece8e1;
  --body: #ddd8d0;
  --muted: #cdc7be;
  --quiet: #b9b3aa;
  --logo-grey: #8e8a85;
  --logo-marty: #7b1e22;
  --rule: rgba(246, 244, 240, 0.28);
  --gutter: 28px;
  --font: "Libre Franklin", "Franklin Gothic Book", "Franklin Gothic Medium", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --top: env(safe-area-inset-top, 0px);
  --bottom: env(safe-area-inset-bottom, 0px);
  --head: 88px;
}
@media (max-width: 760px) { :root { --gutter: 18px; --head: 70px; } }

html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--black); color: var(--white);
  font-family: var(--font); font-size: 16px;
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
* { box-sizing: border-box; }
p, h1, h2, h3, h4, ul, ol, dl, dd, blockquote { margin: 0; padding: 0; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 1px solid var(--white); outline-offset: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Header: the hand-lettered logo, nav centred on its optical middle */
.top {
  position: fixed; z-index: 30; left: 0; right: 0; top: 0;
  padding: calc(var(--top) + 12px) var(--gutter) 0;
  pointer-events: none;
}
.top::before {
  content: ""; position: absolute; inset: 0 0 -56px 0; z-index: -1;
  background: linear-gradient(to bottom, rgba(0,0,0,.78), rgba(0,0,0,.4) 60%, rgba(0,0,0,0));
}
.top a, .top button { pointer-events: auto; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.mark { display: inline-flex; align-items: center; min-height: 64px; margin-left: -2px; padding: 0 2px; text-decoration: none; color: var(--white); }
.logo { display: block; width: auto; overflow: visible; }
.logo-long { height: 58px; }
.logo-short { display: none; height: 42px; }
.logo-marty { fill: var(--logo-marty); }
.logo-o { fill: var(--logo-grey); }
.nav { display: flex; gap: clamp(18px, 2.4vw, 34px); padding-top: 6px; }
.navlink {
  font-size: 15px; font-weight: 400; letter-spacing: 0.005em; text-decoration: none; color: rgba(246,244,240,.84);
  padding: 8px 0; border-bottom: 1px solid transparent; transition: color .3s, border-color .3s;
}
.navlink:hover { color: var(--white); }
.navlink[aria-current="page"] { color: var(--white); border-bottom-color: var(--white); }
.bar-right { display: flex; align-items: center; gap: 22px; }
.menubtn { display: inline-block; font-size: 15px; min-height: 44px; padding: 0 0 0 6px; color: var(--white); }
/* The way back: one quiet link under the logo in every room and index level, named for where it goes. */
.top a.backlink {
  position: absolute; left: var(--gutter); top: calc(var(--top) + 90px);
  font-size: 16px; line-height: 1.3; color: rgba(246,244,240,.84); text-decoration: none;
  padding: 12px 26px 12px 20px; margin-left: -20px; border: 0;
  background: radial-gradient(farthest-side, rgba(0,0,0,.62), rgba(0,0,0,.4) 60%, rgba(0,0,0,0));
  text-shadow: 0 0 2px rgba(0,0,0,.9), 0 0 10px rgba(0,0,0,.85), 0 0 22px rgba(0,0,0,.75);
}
.top a.backlink::before { content: "\2190\00a0\00a0"; content: "\2190\00a0\00a0" / ""; color: var(--muted); }
.top a.backlink:hover { color: var(--white); }
.top a.backlink[hidden] { display: none; }
@media (max-width: 760px) {
  .top a.backlink { top: calc(var(--top) + 64px); }
  .mark { min-height: 48px; }
  .logo-long { display: none; }
  .logo-short { display: block; }
}

/* Full-screen menu (narrow screens) */
.menu {
  position: fixed; inset: 0; z-index: 25; background: var(--black);
  padding: calc(var(--top) + 120px) var(--gutter) calc(var(--bottom) + 40px);
  opacity: 0; overflow-y: auto;
}
.menu ul { list-style: none; display: grid; gap: 4px; }
.menu .navlink { display: inline-block; font-size: clamp(28px, 2.6vw, 36px); padding: 8px 0; }
/* Photo sets: two quiet rows at the foot of the Menu. */
.photo-sets { margin-top: 56px; font-size: 16px; color: var(--muted); }
.photo-sets[hidden], .ps-row[hidden] { display: none; }
.ps-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.ps-label { color: var(--muted); }
.ps-opt { min-height: 44px; font-size: 16px; color: var(--muted); border-bottom: 1px solid transparent; }
.ps-opt[aria-pressed="true"] { color: var(--white); border-bottom-color: var(--white); }
.ps-opt:hover { color: var(--white); }
.ps-sep { color: var(--quiet); }
@media (max-width: 760px) { .menu .navlink { font-size: 26px; } }

/* Rooms */
.world { position: fixed; inset: 0; overflow: hidden; background: var(--black); }
.room { position: absolute; inset: 0; overflow: hidden; visibility: hidden; }
.room.on { visibility: visible; }
.room-work { background: var(--black); z-index: 1; }
.room:not(.room-work) { z-index: 2; }
.room-bg {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%;
  opacity: 0; user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.room-bg.ready { opacity: 1; }

/* Work: one camera turning in a closed room of nine pieces, 40 degrees apart */
.scene { position: absolute; inset: 0; }
/* The room seen through a doorway: drawn above the gallery, clipped to the opening, scaled slower than the wall. */
.room-layer { position: absolute; inset: 0; z-index: 1; overflow: hidden; visibility: hidden; pointer-events: none; }
.room-layer img { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; }
.ring { position: absolute; inset: 0; overflow: hidden; perspective-origin: 50% 50%; }
.face { position: absolute; top: -30%; height: 160%; overflow: hidden; visibility: hidden; backface-visibility: hidden; }
.face {
  --bl: 0%; --br: 0%;
  -webkit-mask-image: linear-gradient(to right, rgba(0,0,0,0) 0, rgba(0,0,0,.15) calc(var(--bl) * .25), rgba(0,0,0,.5) calc(var(--bl) * .5), rgba(0,0,0,.85) calc(var(--bl) * .75), #000 var(--bl), #000 calc(100% - var(--br)), rgba(0,0,0,.85) calc(100% - var(--br) * .75), rgba(0,0,0,.5) calc(100% - var(--br) * .5), rgba(0,0,0,.15) calc(100% - var(--br) * .25), rgba(0,0,0,0) 100%);
          mask-image: linear-gradient(to right, rgba(0,0,0,0) 0, rgba(0,0,0,.15) calc(var(--bl) * .25), rgba(0,0,0,.5) calc(var(--bl) * .5), rgba(0,0,0,.85) calc(var(--bl) * .75), #000 var(--bl), #000 calc(100% - var(--br)), rgba(0,0,0,.85) calc(100% - var(--br) * .75), rgba(0,0,0,.5) calc(100% - var(--br) * .5), rgba(0,0,0,.15) calc(100% - var(--br) * .25), rgba(0,0,0,0) 100%);
}
.plane {
  --mt: 5%; --mb: 10%;
  position: absolute; left: 0; width: 100%; top: 50%;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 var(--mt), #000 calc(100% - var(--mb)), transparent 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 var(--mt), #000 calc(100% - var(--mb)), transparent 100%);
}
.plane img {
  position: absolute; top: 0; height: 100%; display: block;
  opacity: 0; user-select: none; -webkit-user-drag: none; pointer-events: none;
}
.plane img.ready { opacity: 1; }
.strip { position: absolute; top: 0; height: 100%; display: none; background-repeat: no-repeat; }
.strip-l { left: 0; background-position: left center; }
.strip-r { right: 0; background-position: right center; }
.strip-b { display: block; background-position: center bottom; transform: scaleY(-1); }
.strip-t { display: block; background-position: center top; transform: scaleY(-1); }

.zone { position: absolute; top: 0; bottom: 0; width: 33.34%; z-index: 2; -webkit-tap-highlight-color: transparent; }
.zone-prev { left: 0; cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><path d='M21 9 L12 18 L21 27' fill='none' stroke='black' stroke-opacity='.45' stroke-width='4'/><path d='M21 9 L12 18 L21 27' fill='none' stroke='white' stroke-width='1.4'/></svg>") 16 18, w-resize; }
.zone-next { right: 0; cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36'><path d='M15 9 L24 18 L15 27' fill='none' stroke='black' stroke-opacity='.45' stroke-width='4'/><path d='M15 9 L24 18 L15 27' fill='none' stroke='white' stroke-width='1.4'/></svg>") 20 18, e-resize; }
.room-work { touch-action: pan-y pinch-zoom; }
.room-work.dragging, .room-work.dragging .zone { cursor: grabbing; }
.arrow {
  position: absolute; z-index: 3; top: 50%; width: 44px; height: 44px; margin-top: -22px;
  display: grid; place-items: center; color: rgba(246,244,240,.5); transition: color .25s;
}
.arrow:hover { color: var(--white); }
.arrow svg { width: 22px; height: 22px; }
.arrow-prev { left: calc(var(--gutter) - 12px); }
.arrow-next { right: calc(var(--gutter) - 12px); }

.caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.work-tools { position: absolute; z-index: 4; left: var(--gutter); bottom: calc(var(--bottom) + 22px); display: flex; gap: 22px; isolation: isolate; }
.work-tools::before { content: ""; position: absolute; z-index: -1; inset: -16px -30px; background: radial-gradient(closest-side, rgba(0,0,0,.78), rgba(0,0,0,0)); }
.tool { min-height: 44px; padding: 0 2px; font-size: 15px; color: var(--label); border-bottom: 1px solid var(--rule); line-height: 1; }
.tool:hover { color: var(--white); border-bottom-color: var(--white); }
.load-note .tool { margin-left: 12px; }
.link-box { position: fixed; z-index: 60; left: var(--gutter); right: var(--gutter); bottom: calc(var(--bottom) + 80px); font: inherit; font-size: 15px; padding: 10px 12px; background: #111; color: var(--white); border: 1px solid var(--rule); }
.critic { margin: 0 0 34px; }
.critic blockquote { margin: 0; }
.critic p { font-size: 19px; line-height: 1.45; font-style: italic; color: var(--label); }
.critic figcaption { margin-top: 6px; font-size: 15px; color: var(--muted); }
.contact-lead { margin-bottom: 14px; }
.counter {
  position: absolute; z-index: 3; right: var(--gutter); bottom: calc(var(--bottom) + 26px); isolation: isolate;
  font-size: 15px; letter-spacing: 0.08em; color: var(--muted); font-variant-numeric: tabular-nums; pointer-events: none;
}
.counter::before { content: ""; position: absolute; z-index: -1; inset: -18px -26px; background: radial-gradient(closest-side, rgba(0,0,0,.75), rgba(0,0,0,0)); }
.counter b { font-weight: 500; color: var(--white); }
.load-note { position: absolute; z-index: 5; left: var(--gutter); bottom: calc(var(--bottom) + 70px); font-size: 15px; color: var(--label); opacity: 0; pointer-events: none; display: flex; align-items: center; }
/* Wall labels: a small card on the wall to the lower right of each piece; it turns with the room. */
.wall-label {
  position: absolute; z-index: 2000; top: 0; left: 0; width: 230px; visibility: hidden;
  padding: 12px 14px 13px; background: #ebe6dc; color: #1f1c18; box-shadow: 0 1px 2px rgba(0,0,0,.45);
  backface-visibility: hidden; pointer-events: none;
}
.wl-title { font-size: 16.5px; font-weight: 600; line-height: 1.25; }
.wl-title:empty { display: none; }
.wl-detail { margin-top: 3px; font-size: 15px; line-height: 1.35; color: #3a352f; }
.wl-award { margin-top: 7px; font-size: 15px; line-height: 1.35; color: #3a352f; }
.wl-award:empty { display: none; }
/* A work on show elsewhere: one quiet line under its label. */
.wl-onview { margin-top: 7px; font-size: 15px; line-height: 1.35; color: #5a5249; }
.wl-onview[hidden], .cap-onview[hidden], .onview[hidden] { display: none; }
.onview-line { margin-top: 6px; font-size: 15px; }
.onview-line:has(.onview[hidden]) { display: none; }
@media (max-width: 760px) {
  .wall-label { display: none; }
  .caption {
    display: block; position: absolute; z-index: 3; left: var(--gutter); right: calc(var(--gutter) + 72px); bottom: calc(var(--bottom) + 18px);
    width: auto; height: auto; overflow: hidden; clip: auto; white-space: normal;
    padding: 11px 13px 52px; background: #ebe6dc; color: #1f1c18; pointer-events: none;
  }
  .work-tools { left: calc(var(--gutter) + 13px); bottom: calc(var(--bottom) + 22px); gap: 18px; }
  .work-tools::before { display: none; }
  .work-tools .tool { color: #1f1c18; border-bottom-color: rgba(31,28,24,.35); }
  .load-note { bottom: auto; top: calc(var(--top) + 76px); }
  /* Two lines are always reserved for the title and text sits on the lower one, so the baseline never moves. */
  .cap-title { font-size: 17px; font-weight: 600; line-height: 1.25; height: 2.5em; display: flex; align-items: flex-end; }
  .cap-sub, .cap-award { margin-top: 3px; font-size: 15px; line-height: 1.35; color: #3a352f; }
  .cap-award:empty { display: none; }
  .cap-onview { display: block; margin-top: 3px; font-size: 15px; line-height: 1.35; color: #3a352f; text-decoration: none; border-bottom: 1px solid rgba(31,28,24,.3); width: max-content; max-width: 100%; pointer-events: auto; }
  .counter { bottom: calc(var(--bottom) + 22px); }
}
.empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 15px; }

/* Walk / Index: two plain words */
.modes { display: flex; gap: 16px; }
.mode { min-height: 40px; padding: 0 2px; font-size: 15px; color: rgba(246,244,240,.62); transition: color .25s; }
.mode:hover { color: rgba(246,244,240,.9); }
.mode[aria-pressed="true"] { color: var(--white); }
@media (max-width: 760px) { .mode { min-height: 44px; } .bar-right { gap: 14px; } .modes { gap: 12px; } }

/* Index */
.index {
  position: absolute; inset: 0; z-index: 5; overflow-y: auto; overscroll-behavior: contain;
  background: var(--black); visibility: hidden;
  padding: calc(var(--top) + 150px) var(--gutter) calc(var(--bottom) + 48px);
  scrollbar-width: thin; scrollbar-color: rgba(246,244,240,.3) transparent;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--top) + 112px), #000 calc(var(--top) + 140px));
          mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--top) + 112px), #000 calc(var(--top) + 140px));
}
.index::-webkit-scrollbar { width: 6px; }
.index::-webkit-scrollbar-thumb { background: rgba(246,244,240,.3); border-radius: 3px; }
.room-work.indexing .index { visibility: visible; }
.room-work.indexing .zone, .room-work.indexing .arrow, .room-work.indexing .caption, .room-work.indexing .counter { visibility: hidden; }
.crumbs { position: absolute; z-index: 8; left: var(--gutter); top: calc(var(--top) + 92px); display: flex; gap: 10px; align-items: baseline; font-size: 15px; }
.crumbs[hidden] { display: none; }
.crumb { color: var(--muted); text-decoration: none; padding: 6px 0; }
a.crumb:hover { color: var(--white); }
a.crumb { border-bottom: 1px solid var(--rule); padding-bottom: 2px; }
.crumb-current { color: var(--white); }
.crumb-sep { color: var(--quiet); }
.room-work:not(.indexing) .crumbs { display: none; }

.cats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(24px, 4vw, 64px); align-items: end; max-width: 1180px; margin: 0 auto; }
.cats[hidden] { display: none; }
.cat { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--label); }
.cat-fig { display: flex; align-items: flex-end; justify-content: center; height: min(52vh, 540px); width: 100%; }
.cat-fig img { display: block; max-height: 100%; max-width: 100%; width: auto; height: auto; opacity: 0; pointer-events: none; }
.cat-fig img.ready { opacity: 1; }
.cat-title { margin-top: 18px; font-size: 20px; font-weight: 400; color: var(--label); border-bottom: 1px solid transparent; transition: border-color .25s; }
.cat:hover .cat-title, .cat:focus-visible .cat-title { border-bottom-color: var(--rule); }
.cat:focus-visible { outline: none; }
.cat:focus-visible .cat-fig { outline: 1px solid var(--white); outline-offset: 6px; }
.index-more { margin: 64px auto 0; max-width: 1180px; text-align: center; font-size: 15px; color: var(--muted); }
.index-more[hidden] { display: none; }
.series-view[hidden] { display: none; }
.series-h { font-size: 24px; font-weight: 500; color: var(--label); margin: 0 0 20px; }
.rows { position: relative; }
.tile { position: absolute; display: block; padding: 0; overflow: visible; background: transparent; cursor: zoom-in; }
.tile img { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .4s ease; pointer-events: none; }
.tile img.ready { opacity: 1; }
.tile .tcap {
  position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 10px 9px;
  font-size: 15px; line-height: 1.3; color: var(--white); text-align: left;
  background: linear-gradient(to top, rgba(0,0,0,.8), rgba(0,0,0,0));
  opacity: 0; transition: opacity .2s ease; pointer-events: none;
}
.tile:hover .tcap, .tile:focus-visible .tcap { opacity: 1; }
.tile:focus-visible { outline: 1px solid var(--white); outline-offset: 2px; }
@media (hover: none) { .tile .tcap { display: none; } }
@media (max-width: 760px) {
  .index { padding-top: calc(var(--top) + 120px);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--top) + 84px), #000 calc(var(--top) + 108px));
            mask-image: linear-gradient(to bottom, transparent 0, transparent calc(var(--top) + 84px), #000 calc(var(--top) + 108px)); }
  .crumbs { top: calc(var(--top) + 70px); }
  .cats { grid-template-columns: 1fr; gap: 44px; }
  .cat-fig { height: 54vh; }
  .series-h { font-size: 21px; }
}

/* Plate: one piece at a time, large on black, catalogue label underneath */
.plate { position: absolute; inset: 0; z-index: 7; background: var(--black); padding: calc(var(--top) + 140px) var(--gutter) calc(var(--bottom) + 70px); display: flex; flex-direction: column; }
.plate[hidden] { display: none; }
.plate-stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: pan-y pinch-zoom; }
.plate-img { position: absolute; inset: 0; margin: auto; width: auto; height: auto; max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; }
.plate-img.ready { opacity: 1; }
.plate-img.plate-ph, .viewer-img.viewer-ph { opacity: 1; filter: blur(6px); }
.plate-img.plate-ph[hidden], .viewer-img.viewer-ph[hidden] { display: none; }
/* Loading and failure for a work's photograph: quiet, centred in the picture field, Close stays usable. */
.photo-status { position: absolute; inset: 0; margin: auto; height: max-content; text-align: center; font-size: 16px; color: var(--label); }
.photo-status[hidden] { display: none; }
.photo-status .tool { margin-left: 12px; }
.plate-label { flex: 0 0 auto; margin-top: 18px; text-align: center; min-height: 96px; }
.plate-title { font-size: 23px; font-weight: 500; color: var(--white); }
.plate-title:empty { display: none; }
.plate-detail { margin-top: 6px; font-size: 15.5px; color: var(--muted); }
.plate-award { margin: 6px auto 0; max-width: 40rem; font-size: 15px; line-height: 1.45; color: var(--muted); }
.plate-award:empty { display: none; }
.plate-views { margin-top: 6px; display: flex; gap: 14px; justify-content: center; }
.plate-view, .viewer-view { min-height: 40px; font-size: 15px; color: rgba(246,244,240,.62); }
.plate-view[aria-pressed="true"], .viewer-view[aria-pressed="true"] { color: var(--white); }
.plate-walk-line { margin-top: 8px; font-size: 15px; }
.plate-count { position: absolute; right: var(--gutter); top: calc(var(--top) + 98px); font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.plate-nav {
  position: absolute; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: grid; place-items: center;
  color: rgba(246,244,240,.62); z-index: 2;
}
.plate-nav:hover { color: var(--white); }
.plate-nav svg { width: 24px; height: 24px; }
.plate-prev { left: calc(var(--gutter) - 12px); }
.plate-next { right: calc(var(--gutter) - 12px); }
@media (max-width: 760px) {
  .plate { padding-top: calc(var(--top) + 112px); padding-bottom: calc(var(--bottom) + 96px); }
  .plate-count { top: calc(var(--top) + 76px); }
}

/* Wall text: headings and spacing only. A feathered dark pool sits behind each panel. */
.wall {
  position: absolute; z-index: 2; left: 0; right: 0;
  top: max(calc(var(--top) + 112px), 16vh); bottom: calc(var(--bottom) + 40px);
  padding: 0 var(--gutter);
  display: flex; justify-content: center; align-items: flex-start;
  overflow-x: clip;
  opacity: 0; visibility: hidden;
}
.label { position: relative; isolation: isolate; max-width: 36rem; width: 100%; max-height: 100%; display: flex; flex-direction: column; }
.label::before {
  content: ""; position: absolute; z-index: -1; inset: -4rem -5rem;
  background: radial-gradient(closest-side, rgba(0,0,0,.9), rgba(0,0,0,.84) 64%, rgba(0,0,0,.45) 84%, rgba(0,0,0,0));
  pointer-events: none;
}

 International PPM Brno Quilt Show, Brno, Czech Republic, 2023</li><li>Welcome to My World, Nadelwelt 2023, Karlsruhe, Germany, 2023</li><li>12th Expo Patchwork 2020, Quilters de México, Mexico City, Mexico, 2020</li><li>Aiguilles-en-Luberon, Rencontres Internationales de Patchwork et d’Art Textile, Grambois, France, 2019</li><li>24th Le Carrefour Européen du Patchwork, Sainte-Marie-aux-Mines, France, 2018</li></ul><h3 class="sh">Catalogues</h3><ul class="cvlist"><li><i>MartyO: Social Security</i>, Oceanside Museum of Art, 2021. 40 pages, 8 × 8 in.</li><li><i>Marty Ornish</i>, art book, 2019. ISBN 978-0-578-56803-4. 36 pages, 8 × 8 in.</li></ul><h3 class="sh">Awards</h3><ul class="cvlist"><li>Honorable Mention, “His mother said little Zachery was such a help to her” (backpack), Accessories, Sebastopol Center for the Arts, Sebastopol, California, 2023</li><li>Award of Excellence, “A_dressing Shame”, Southwest Regional Surface Design Association, Juror: Annie Lopez, Tubac Center of the Arts, Arizona, 2022</li><li>First Place, “Biased” (renamed “shy Lisbeth breaks out of her shell”), H x W x D: A 3-D Celebration of Art, San Fernando Valley Arts &amp; Cultural Center, California, 2021</li><li>Honorable Mention, “Love, Honor &amp; Obey”, Old Myths, New Stories, Curtis Center for the Arts, Greenwood Village, Colorado, 2020</li><li>Best of Show, “she gazed at the carousel through rose-colored glasses”, Form, Not Function, Carnegie Center for Art and History, New Albany, Indiana, 2020</li></ul><h3 class="sh">Selected press</h3><ul class="cvlist"><li>Violet Protest: A creative call for national unity, PBS documentary, first screening Phoenix Art Museum, 2024</li><li>“A Collector’s Space”, Fiber Art Now, Fall 2023</li><li>The Quilt Show, “Upcycling Vintage Textiles and Zipper Work with Marty Ornish”, Episode 3108, 2022</li><li>“Marty Ornish: Neues Leben für alte Quilts”, Patchwork Professional, Germany, April 2020</li><li>“La Mesa Artist Creates Clothing By Turning Trash Into Treasures”, San Diego Union-Tribune, November 26, 2019</li><li>“Five Exhibitions of Quilt and Fabric Art”, by Karla Peterson, San Diego Union-Tribune, October 16, 2019</li><li>“Marty Ornish Upcycled Couture”, by Beth Smith, Fiber Art Now, Spring 2019</li><li>“Age No Impediment to Fiber Artist’s Creativity”, by Pam Kragen, San Diego Union, July 15, 2018</li><li>“Le quilt de récup’ pour des robes sophistiquées”, Dernières Nouvelles d’Alsace, September 18, 2018</li></ul></div><button class="morebtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></div>

<template id="tpl-teaching">
      <div class="label"><div class="scroller" tabindex="0" role="region" aria-label="Teaching"><h2 class="sr">Teaching</h2><h3 class="sh">Workshops</h3><div class="item"><h4 class="item-title">Jean-ius Jacket Upcycling</h4><p class="item-meta">6 or 12 hours &middot; 12 students max</p></div><div class="item"><h4 class="item-title">Denim Diaries: A Story Quilt Journey</h4><p class="item-meta">6 hours &middot; 12 students max</p></div><h3 class="sh">Talks</h3><div class="item"><h4 class="item-title">Tattered Splendor: MartyO’s Wearable Art Ensembles</h4><p class="item-meta">Zoom or in-person, with trunk show</p><p class="item-note">I share a curated slideshow of my award-winning wearable art, all made from deconstructed vintage quilts and linens.</p></div><div class="item"><h4 class="item-title">Whispers from the Muse: Inside the Creative Mind</h4><p class="item-meta">Zoom or in-person, with trunk show</p><p class="item-note">We’ll explore the mysteries of creativity: how it flows, why it stalls, and how to invite it back.</p></div><div class="item"><h4 class="item-title">Fashion Dangers: From Victorian to Vanguard</h4><p class="item-meta">A visual lecture</p><p class="item-note">This compelling lecture traces the shadowy side of fashion history, from arsenic-laced gowns of the Victorian era to today’s fast fashion catastrophes.</p></div><div class="item"><h4 class="item-title">Worn, Torn, Reborn: Art Quilting Without a Map</h4><p class="item-meta">In-person only, with trunk show</p><p class="item-note">This presentation celebrates my no-rules approach to art quilting, where perfection is tossed aside in favor of curiosity, emotion, and bold experimentation.</p></div><div class="item"><h4 class="item-title">Art as Activism: Stitching for Change</h4><p class="item-meta">Zoom or in-person, with trunk show</p><p class="item-note">This presentation explores the power of cloth to challenge, heal, and inspire.</p></div><div class="item"><h4 class="item-title">Jean-ius: The Art of Embellished Jackets</h4><p class="item-meta">Zoom or in-person, with trunk show</p><p class="item-note">I share my personal story of transforming ordinary jackets into expressive, eye-catching works of wearable art.</p></div><p class="fine">Lectures run one hour with 30 minutes of Q&amp;A. Fees and booking: <a class="inline-link" href="#contact" data-room="contact">write to Marty</a>.</p></div><button class="morebtn" type="button" tabindex="-1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg></button></div>
</template>

<template id="tpl-about">
      <div class="label">
        <h2 class="ltitle">Marty Ornish (MartyO)</h2>
        <p class="lbody big">Wielding a needle and thread, using thread-worn, deconstructed and reconstructed patchwork quilts as her palette, Marty's wearable art and art quilts are pointed commentary on the stereotypic, disempowering and oppressive roles forced onto women by our society over the last century, and to this very day in many countries in the world.</p>

      var r = t.img.getBoundingClientRect();
      if (r.bottom < 0 || r.top > H || r.height === 0) return true;
      return t.img.complete && (t.img.naturalWidth === 0 || t.img.classList.contains('ready'));
    });
  }
  function coversDrawn() { return SERIES.every(function (sr) { return !sr._cover || (sr._cover.complete && (sr._cover.naturalWidth === 0 || sr._cover.classList.contains('ready'))); }); }
  function plateDrawn() { return PS.failed || slotDrawn(PS); }
  function viewerDrawn() { return slotDrawn(VS); }
  function viewNames(w) { return w.viewNames || w.views.map(function (_, i) { return 'View ' + (i + 1); }); }
  function showView() {
    var st = C.viewer, w = st.list[st.i], v = w.views[st.vi] || w.views[0], L = labelOf(w.id), names = viewNames(w);
    var src = workSrc(v[0]), vi = st.vi;
    // Never enlarge a photograph past its own pixels.
    slotSet(VS, src, { w: v[2], h: v[3], thumb: v[1] ? workSrc(v[1]) : null,
      alt: (L.title || L.kind || st.group) + ' by Marty Ornish' + (w.views.length > 1 ? ', ' + names[vi] : '') }, function () { viewText(st, w, vi); });
  }
  function viewText(st, w, vi) {
    var L = labelOf(w.id), names = viewNames(w);
    $('viewerTitle').textContent = L.title || L.kind || st.group;
    $('viewerSeries').textContent = [L.year, L.materials, L.dimensions].filter(Boolean).join(', ') || (L.title ? L.kind || st.group : '');
    $('viewerAward').textContent = L.award || '';
    setOnView($('viewerOnView'), w.id);
    $('viewerCount').textContent = st.list.length > 1 ? (st.i + 1) + ' / ' + st.list.length : '';
    $('viewerPrev').hidden = $('viewerNext').hidden = st.list.length < 2;
    var vv = $('viewerViews'); vv.textContent = '';
    if (w.views.length > 1) w.views.forEach(function (_, i) {
      var b = el('button', 'viewer-view', names[i]); b.type = 'button';
      b.setAttribute('aria-pressed', i === vi ? 'true' : 'false');
      b.addEventListener('click', function () { st.vi = i; showView(); });
      vv.appendChild(b);
    });
    var walk = $('viewerWalk'), si2 = -1;
    ST.forEach(function (s, i) { if (s.id === w.station) si2 = i; });
    walk.hidden = si2 < 0 || st.look;
    walk.onclick = function (e) { e.preventDefault(); if (si2 >= 0) dispatch({ type: 'go', hash: stationHash(si2), jump: true }); };
    $('viewerLink').onclick = function () { copyLink(linkFor(w, si2), $('viewerLink')); };
  }
  function stepViewer(dd) { var st = C.viewer; if (st.list.length < 2) return; st.i = mod(st.i + dd, st.list.length); st.vi = 0; showView(); }
  function closeViewer(tm, silent) {
    if (!C.viewer) return;
    var st = C.viewer; C.viewer = null;
    slotReset(VS);
    st.bg.forEach(function (b) { if (b.n.isConnected) b.n.inert = b.inert; });
    updateNav();
    render(now());
    var target = null;
    if (st.from.kind === 'gallery') {
      var host = galleryHost(st.from.room), sc = host.closest('.scroller') || host; sc.scrollTop = st.from.scroll;
      var tile = wTiles.filter(function (x) { return x.room === st.from.room && x.si === st.from.si && x.ti === st.i; })[0];
      target = tile && tile.el;
    } else target = $('lookBtn');
    if (target && !silent) { try { target.focus({ preventScroll: true }); } catch (err) { target.focus(); } }
    kick();
  }
  $('viewerClose').addEventListener('click', function () { closeViewer(now()); });
  $('viewerPrev').addEventListener('click', function () { stepViewer(-1); });
  $('viewerNext').addEventListener('click', function () { stepViewer(1); });
  swipe($('viewerStage'), stepViewer);
  viewer.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeViewer(now()); }
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); stepViewer(e.key === 'ArrowRight' ? 1 : -1); }
    else if (e.key === 'Tab') {
      var f = Array.prototype.slice.call(viewer.querySelectorAll('button, a[href]')).filter(function (x) { return !x.hidden && x.offsetParent !== null; });
      var i = f.indexOf(document.activeElement);
      if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    }
  });

  // =====================================================================================
  // Permanent links and Look closely
  // =====================================================================================
  function baseUrl() { return location.href.split('#')[0]; }
  function linkFor(w, stationIdx) {
    if (stationIdx >= 0) return baseUrl() + '#' + stationHash(stationIdx);
    for (var i = 0; i < SERIES.length; i++) {
      var ws = SERIES[i].works || [];
      for (var j = 0; j < ws.length; j++) if (ws[j].id === w.id) return baseUrl() + '#' + SCENE.index.hash + '/' + SERIES[i].slug + '/' + ws[j].slug;
    }
    for (var r in SCENE.galleries) {
      var room = SCENE.rooms.filter(function (x) { return x.gallery === r; })[0];
      if (room) return baseUrl() + '#' + room.hash;
    }
    return baseUrl();
  }
  function copyLink(url, btn) {
    var said = function (msg) { live.textContent = msg; };
    var fallback = function () {
      var box = $('linkBox');
      if (!box) { box = el('input', 'link-box'); box.id = 'linkBox'; box.readOnly = true; box.setAttribute('aria-label', 'Link to this work'); document.body.appendChild(box); }
      box.value = url; box.hidden = false; box.focus(); box.select();
      said('Link selected. Press Cmd+C or Ctrl+C to copy.');
      box.onblur = function () { box.hidden = true; };
    };
    try { navigator.clipboard.writeText(url).then(function () { said('Link copied.'); flash(btn); }, fallback); } catch (err) { fallback(); }
  }
  function flash(btn) { if (!btn) return; var t = btn.textContent; btn.textContent = 'Link copied'; setTimeout(function () { btn.textContent = t; }, 1600); }
  $('lookBtn').addEventListener('click', function () { if (C.view === 'walk' && C.intent.room === 'work' && !C.door) openLook(); });
  $('linkBtn').addEventListener('click', function () { copyLink(baseUrl() + '#' + stationHash(nearestIdx(C.yaw)), $('linkBtn')); });
  $('plateLink').addEventListener('click', function () {
    var w = SERIES[C.idx.series].works[C.idx.work];
    copyLink(baseUrl() + '#' + SCENE.index.hash + '/' + SERIES[C.idx.series].slug + '/' + w.slug, $('plateLink'));
  });

  // =====================================================================================
  // Menu (narrow screens)
  // =====================================================================================
  function setMenu(open, refocus) {
    C.menuOpen = open;
    menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menuBtn.textContent = open ? 'Close' : 'Menu';
    if (open) menu.hidden = false;
    updateNav(); kick();
    if (open) { var first = menu.querySelector('[aria-current="page"]') || menu.querySelector('a'); if (first) first.focus(); }
    else if (refocus) menuBtn.focus();
  }
  menuBtn.addEventListener('click', function () { setMenu(!C.menuOpen, true); });
  // Photos: Museum | Original (and, once a mannequin set exists, Mannequins: Dress form | Figure), at the Menu's foot.
  var photoCtl = $('photoSets');
  function renderPhotoCtl() {
    photoCtl.hidden = !SETS.museum;
    each('#photoSets [data-set]', function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-set') === photoSet ? 'true' : 'false'); });
    $('mannequinRow').hidden = !(SETS.figure && photoSet === 'museum');
    each('#photoSets [data-mq]', function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-mq') === mannequin ? 'true' : 'false'); });
  }
  function applyPhotos() {
    each('img[data-file]', function (img) {
      var u = workSrc(img.getAttribute('data-file'));
      if (img.getAttribute('src') !== u) { img.classList.remove('ready'); img.src = u; }
    });
    if (C.view === 'index' && C.idx.level === 3) showPlate();
    if (C.viewer) showView();
    renderPhotoCtl(); kick();
  }
  each('#photoSets [data-set]', function (b) { b.addEventListener('click', function () { photoSet = b.getAttribute('data-set'); remember('martyo.photos', photoSet); applyPhotos(); }); });
  each('#photoSets [data-mq]', function (b) { b.addEventListener('click', function () { mannequin = b.getAttribute('data-mq'); remember('martyo.mannequins', mannequin); applyPhotos(); }); });
  renderPhotoCtl();
  menu.addEventListener('keydown', function (e) {
    if (e.key !== 'Tab') return;
    var items = Array.prototype.slice.call(menu.querySelectorAll('a, button')).filter(function (x) { return x.offsetParent !== null; }), i = items.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); menuBtn.focus(); }
    else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); menuBtn.focus(); }
  });
  menuBtn.addEventListener('keydown', function (e) {
    if (!C.menuOpen || e.key !== 'Tab') return;
    var items = Array.prototype.slice.call(menu.querySelectorAll('a, button')).filter(function (x) { return x.offsetParent !== null; }); e.preventDefault();
    (e.shiftKey ? items[items.length - 1] : items[0]).focus();
  });

  // =====================================================================================
  // Contact: the address is assembled only when the room is first shown
  // =====================================================================================
  var MAIL = [112, 115, 102, 50, 111, 109, 100, 113, 106, 68, 107, 119, 108, 114, 117, 115, 49, 125, 119, 118, 100, 113];
  var emailEl = $('email'), copyBtn = $('copyBtn'), copyStatus = $('copyStatus'), copyTimer = 0, addr = '';
  function revealEmail() {
    if (addr) return;
    addr = MAIL.map(function (c, i) { return String.fromCharCode(c - 3 - (i % 2)); }).reverse().join('');
    emailEl.textContent = ''; emailEl.appendChild(document.createTextNode(addr)); emailEl.removeAttribute('aria-label');
  }
  emailEl.addEventListener('click', function () { revealEmail(); emailEl.href = ['mai', 'lto:'].join('') + addr; });
  function selectEmail() { try { var r = document.createRange(); r.selectNodeContents(emailEl); var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); } catch (err) { /* nothing else */ } }
  copyBtn.addEventListener('click', function () {
    revealEmail();
    var said = function (msg) { copyStatus.textContent = msg; clearTimeout(copyTimer); copyTimer = setTimeout(function () { copyStatus.textContent = ''; }, 3200); };
    var fail = function () { selectEmail(); said('Selected. Press Cmd+C or Ctrl+C to copy.'); };
    try { navigator.clipboard.writeText(addr).then(function () { said('Copied.'); }, fail); } catch (err) { fail(); }
  });

  // =====================================================================================
  // Exhibitions and the slim line, from EVENTS and today's date
  // =====================================================================================
  var NOW_HINT = null;
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function parts(iso) { var a = iso.split('-'); return { y: +a[0], m: +a[1] - 1, d: +a[2] }; }
  function fmtDate(iso) { var p = parts(iso); return MONTHS[p.m] + ' ' + p.d + ', ' + p.y; }
  function fmtRange(e) {
    var a = parts(e.start), b = parts(e.end);
    if (e.start === e.end) return fmtDate(e.start);
    if (a.y === b.y && a.m === b.m) return MONTHS[a.m] + ' ' + a.d + ' to ' + b.d + ', ' + b.y;
    if (a.y === b.y) return MONTHS[a.m] + ' ' + a.d + ' to ' + MONTHS[b.m] + ' ' + b.d + ', ' + b.y;
    return fmtDate(e.start) + ' to ' + fmtDate(e.end);
  }
  // A work on show elsewhere today: one quiet line, "On view at <venue> through <Month D>", or '' (date-aware).
  function onViewLine(id) {
    var t = TODAY || todayIso(), list = (ONEX[id] || []).filter(function (e) { return e.start <= t && t <= e.end; })
      .sort(function (a, b) { return a.end < b.end ? -1 : 1; });
    if (!list.length) return '';
    var p = parts(list[0].end);
    return 'On view at ' + list[0].venue + ' through ' + MONTHS[p.m] + ' ' + p.d;
  }
  function setOnView(node, id) {
    var t = onViewLine(id); node.textContent = t; node.hidden = !t;
    if (node === capOnView) node.tabIndex = labelPhone() ? 0 : -1;    // the desktop caption is for screen readers only
  }
  function todayIso() { var dt = new Date(); return dt.getFullYear() + '-' + pad(dt.getMonth() + 1) + '-' + pad(dt.getDate()); }
  function exLabel(e) {
    var box = el('div', 'ex');
    box.appendChild(el('h4', 'ex-title', e.title));
    if (e.note) box.appendChild(el('p', 'ex-note', e.note));
    box.appendChild(el('p', 'ex-venue', e.venue)); box.appendChild(el('p', 'ex-city', e.city)); box.appendChild(el('p', 'ex-dates', fmtRange(e)));
    return box;
  }
  (function renderEvents() {
    var t = todayIso();
    var nowE = EVENTS.filter(function (e) { return e.start <= t && t <= e.end; }).sort(function (a, b) { return a.end < b.end ? -1 : 1; });
    var soon = EVENTS.filter(function (e) { return e.start > t; }).sort(function (a, b) { return a.start < b.start ? -1 : 1; });
    var past = EVENTS.filter(function (e) { return e.end < t; });
    nowE.forEach(function (e) { $('exNowList').appendChild(exLabel(e)); });
    soon.forEach(function (e) { $('exSoonList').appendChild(exLabel(e)); });
    $('exNow').hidden = !nowE.length; $('exSoon').hidden = !soon.length;
    // Hook for a possible short corner hint (for example "Now: Huntington Beach"). Nothing is rendered for now.
    var pick = nowE[0] || soon[0];
    NOW_HINT = pick ? { now: !!nowE.length, title: pick.title, venue: pick.venue, city: pick.city, start: pick.start, end: pick.end } : null;
    var sel = $('selectedList');
    past.filter(function (e) { return e.selected; }).sort(function (a, b) { return a.end < b.end ? -1 : 1; }).forEach(function (e) {
      sel.insertBefore(el('li', '', [e.title, e.note && e.note.toLowerCase(), e.venue, e.city, e.end.slice(0, 4)].filter(Boolean).join(', ')), sel.firstChild);
    });
  })();

  function updateMore(sc) { if (!sc) return; var more = sc.scrollHeight - sc.clientHeight - sc.scrollTop > 6; sc.classList.toggle('more', more); sc.parentNode.classList.toggle('has-more', more); }
  each('.scroller', function (sc) {
    sc.addEventListener('scroll', function () { updateMore(sc); }, { passive: true });
    var btn = sc.parentNode.querySelector('.morebtn');
    if (btn) btn.addEventListener('click', function () { sc.scrollBy({ top: sc.clientHeight * 0.8, behavior: reduced ? 'auto' : 'smooth' }); });
  });
  function updateAllMore() { each('.scroller', updateMore); }

  // =====================================================================================
  // Start: the state the hash asks for, reached without motion
  // =====================================================================================
  measure();
  ensureStation(0); ensureStation(1); ensureStation(ST.length - 1);
  (function start() {
    var r = parseRoute(curHash()), tm = now();
    notePlace(r);
    try { if (curHash() !== r.hash) history.replaceState(null, '', '#' + r.hash); } catch (err) { /* sandboxed */ }
    if (r.room !== 'work') {
      var byaw = ST[0].yawDeg, yaw = byaw + gapRight(0) / 2;
      C.door = makeDoor(r.room, yaw, byaw, 0);
      C.yaw = yaw; C.d = 1; C.intent.room = r.room;
      ensureRoom(r.room);
      if (ROOM[r.room].gallery) buildGallery(r.room);
      if (r.room === 'contact') revealEmail();
      C.wall[r.room] = Tween(1);
    }
    if (r.index) { setIndex(r.index, tm); C.indexA = Tween(1); if (r.index.level === 3) C.plateA = Tween(1); }
    if (r.station != null) jumpToStation(r.station);
    C.ui = Tween(r.room === 'work' && !r.index ? 1 : 0);
    updateNav(); announce();
    render(tm);
    setTimeout(updateAllMore, 0);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { dispatch({ type: 'resize' }); });
  })();

  // =====================================================================================
  // Test hook: a stable contract for external tests
  // =====================================================================================
  var settleWaiters = [];
  function resolveSettle() { var w = settleWaiters; settleWaiters = []; w.forEach(function (f) { f(); }); }
  function visibleLayers(tm) {
    var out = [], ia = tw(C.indexA, tm);
    // The gallery counts as visible only when the picture in front of the camera is actually drawn.
    var fn = faces[nearestIdx(C.yaw)];
    if (sections.work.classList.contains('on') && ia < 0.999 && (fn.shown || fn.ph)) out.push('gallery');
    ROOM_IDS.forEach(function (r) { if (r !== 'work' && sections[r].classList.contains('on')) out.push('room:' + r); });
    if (ia > 0.001) out.push(C.idx.level === 3 && tw(C.plateA, tm) > 0.999 ? 'plate' : 'index');
    if (C.viewer && viewer.style.display === 'block') out.push('viewer');     // readiness and error are reported separately
    if (C.menuOpen) out.push('menu');
    return out;
  }
  var HOOK = {
    version: 'r6',
    scene: SCENE,
    state: function () {
      var tm = now(), m = modeName(tm), progress;
      if (C.yawSeg) progress = clamp((tm - C.yawSeg.t0) / (C.yawSeg.T * 1000), 0, 1);
      else if (C.dSeg) progress = clamp((tm - C.dSeg.t0) / (C.dSeg.T * 1000), 0, 1);
      else if (C.idxT) progress = clamp((tm - C.idxT.t0) / (C.idxT.T * 1000), 0, 1);
      else progress = busy(tm) ? 0 : 1;
      var a = document.activeElement, v = activeView();
      return {
        mode: m,
        view: C.viewer ? 'viewer' : C.view === 'index' ? 'index:' + C.idx.level : C.intent.room === 'work' ? 'walk' : 'room:' + C.intent.room,
        hash: curHash(), transitioning: busy(tm), progress: progress, visibleLayers: visibleLayers(tm),
        activeElementInView: !!(a && v && (v === a || v.contains(a))),
        camera: { yaw: C.yaw, d: C.d, station: C.station, stationId: ST[nearestIdx(C.yaw)].id, door: C.door ? { room: C.door.room, yaw: C.door.yaw, sEnd: C.door.sEnd } : null,
          cover: C.cover || null, doorPicture: C.door ? C.door.f.shown : null, layered: roomLayer.style.visibility === 'visible', F: G.F, q: G.q, off: G.off, viewHalf: G.viewHalf, frame: G.mode, W: G.W, H: G.H, artWarn: G.warn.slice() },
        index: { level: C.view === 'index' ? C.idx.level : 0, series: C.idx.series >= 0 ? SERIES[C.idx.series].slug : null },
        pending: !!C.pending, failed: C.failed ? C.failed.urls.slice() : C.modeFail ? C.modeFail.slice() : null,
        rendered: { station: ST[nearestIdx(C.yaw)].id, picture: faces[nearestIdx(C.yaw)].shown || null, placeholder: !faces[nearestIdx(C.yaw)].shown && !!faces[nearestIdx(C.yaw)].ph, frame: G.mode, wantFrame: G.want,
          viewerImage: C.viewer ? VS.want : null, viewerReady: C.viewer ? viewerDrawn() : null, viewerError: C.viewer ? VS.failed : null,
          plateImage: C.view === 'index' && C.idx.level === 3 ? PS.want : null, plateReady: C.view === 'index' && C.idx.level === 3 ? plateDrawn() && !PS.failed : null,
          plateError: C.view === 'index' && C.idx.level === 3 ? PS.failed : null }
      };
    },
    nowHint: function () { return NOW_HINT; },
    // Test fixture: inject on-exhibit data and a date, then refresh every label that shows the line.
    exhibitFixture: function (map, today) {
      ONEX = map || {}; TODAY = today || null;
      faces.forEach(function (f) { setOnView(f.labelOn2, f.s.id); });
      lastNear = -1; sizePlate(); if (C.viewer) showView(); if (C.view === 'index' && C.idx.level === 3) showPlate(); kick();
    },
    go: function (target) { dispatch({ type: 'go', hash: String(target).replace(/^#/, '') }); },
    next: function () { dispatch({ type: 'step', dir: 1 }); },
    prev: function () { dispatch({ type: 'step', dir: -1 }); },
    settle: function () { return new Promise(function (res) { if (!raf && !busy(now())) res(); else { settleWaiters.push(res); kick(); } }); }
  };
  // The hook appears with the first drawn frame: once the view in front reports a visible layer (the placeholders are
  // inline, so this is a few milliseconds), or after one second whatever the state.
  (function installHook(t0) {
    if (visibleLayers(now()).length || now() - t0 > 1000) { window.__museum = HOOK; return; }
    setTimeout(function () { installHook(t0); }, 4);
  })(now());

})();
</script>
